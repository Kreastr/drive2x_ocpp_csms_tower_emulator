name: Update latest.zip

on:
  push:
    tags:
      - "proxy-v*"

permissions:
  contents: write

jobs:
  release-zip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create latest.zip
        run: |
          zip -r latest.zip . \
            -x ".git/*" \
            -x ".github/*"

      - name: Upload latest.zip to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" latest.zip --clobber
